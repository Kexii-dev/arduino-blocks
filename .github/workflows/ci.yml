name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check (syntax)
        run: |
          node --check src/main.js
          node --check src/blocks.js
          node --check src/generator.js

      - name: Run generator tests (headless)
        run: node tests/gen-test.mjs

      - name: Run virtual simulator tests
        run: node tests/sim-virtual-test.mjs

      - name: Build production bundle
        run: npm run build