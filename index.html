<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino Blocks — Nouvelle génération</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
           background: #1e1e1e; color: #d4d4d4; }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; flex-wrap: wrap;
             background: #252526; border-bottom: 1px solid #3c3c3c; }
    header h1 { font-size: 15px; margin: 0 4px 0 0; color: #00979D; font-weight: 700; white-space: nowrap; }
    header .tag { font-size: 11px; color: #808080; }
    #status { font-size: 12px; color: #00979D; }
    .palette { display: flex; gap: 8px; flex-wrap: wrap; }
    .catnav { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; }
    .cat-tab { background: #2d2d2d; color: #b8b8b8; border: 1px solid #3c3c3c; border-radius: 6px;
               padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .cat-tab.active { background: #00979D; color: #fff; border-color: #00979D; }
    .blockrow { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; }
    .pal-btn { background: #2d2d2d; color: #e8e8e8; border: 1px solid #3c3c3c; border-radius: 6px;
               padding: 7px 12px; font-size: 13px; cursor: pointer;
               touch-action: manipulation; user-select: none; }
    .pal-btn:active { background: #00979D; color: #fff; }
    .pal-btn.pin { border-left: 3px solid #00979D; }
    .topgrp { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    #langSel, .tbtn { background: #2d2d2d; color: #e8e8e8; border: 1px solid #3c3c3c; border-radius: 6px;
                      padding: 6px 10px; font-size: 13px; cursor: pointer; }
    .tbtn.hl { border-color: #00979D; color: #a5f0f4; }
    #container { flex: 1; position: relative; }
    #blocklyDiv { position: absolute; inset: 0; }
    aside { position: absolute; top: 10px; right: 10px; width: 360px; max-width: 74vw;
            background: rgba(37, 37, 38, .96); border: 1px solid #3c3c3c; border-radius: 8px;
            padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 12px; line-height: 1.5; max-height: 66vh; overflow: auto; z-index: 20; }
    aside h2 { font-size: 12px; margin: 0 0 6px; color: #00979D; font-weight: 600; }
    aside pre { margin: 0; white-space: pre-wrap; color: #9cdcfe; }
    .hint { font-family: inherit; font-size: 12px; color: #cccccc; margin: 6px 0 0; }
    /* ---- comptes (porté de account.js legacy) ---- */
    .acct-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 11000;
                     display: flex; align-items: center; justify-content: center; }
    .acct-card { background: #252526; border: 1px solid #3c3c3c; border-radius: 10px; width: 400px;
                 max-width: 94vw; max-height: 90vh; overflow: auto; color: #d4d4d4; }
    .acct-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
                 border-bottom: 1px solid #3c3c3c; font-size: 15px; font-weight: 600; color: #a5f0f4; }
    .acct-close { background: none; border: 0; color: #808080; font-size: 22px; cursor: pointer; line-height: 1; }
    .acct-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .acct-body label { font-size: 12px; color: #a0a0a0; }
    .acct-body input { background: #1e1e1e; border: 1px solid #3c3c3c; color: #e8e8e8; border-radius: 6px;
                       padding: 8px 10px; font-size: 14px; width: 100%; }
    .acct-tabs { display: flex; gap: 6px; }
    .acct-tab { flex: 1; background: #2d2d2d; color: #a0a0a0; border: 1px solid #3c3c3c; border-radius: 6px;
                padding: 7px; cursor: pointer; font-size: 13px; }
    .acct-tab.active { background: #00979D; color: #fff; border-color: #00979D; }
    .acct-btn { background: #2d2d2d; color: #e8e8e8; border: 1px solid #3c3c3c; border-radius: 6px;
                padding: 9px 12px; cursor: pointer; font-size: 13px; }
    .acct-btn.acct-primary { background: #00878f; color: #fff; border-color: #00878f; font-weight: 600; }
    .acct-btn.acct-danger { background: #6b2d2d; color: #ffd7d7; border-color: #944040; }
    .acct-btn:disabled { opacity: .5; cursor: not-allowed; }
    .acct-row { display: flex; gap: 8px; }
    .acct-row .acct-btn { flex: 1; }
    .acct-err { color: #ff6b6b; font-size: 12px; min-height: 16px; }
    .acct-pass-row { display: flex; gap: 6px; }
    .acct-pass-row input { flex: 1; }
    .acct-eye { background: none; border: 0; color: #808080; cursor: pointer; font-size: 16px; }
    .acct-meter { height: 8px; background: #3c3c3c; border-radius: 4px; overflow: hidden; }
    .acct-meter-fill { height: 100%; width: 0; background: #ff6b6b; transition: width .2s; }
    .acct-meter.weak .acct-meter-fill { width: 25%; background: #ff6b6b; }
    .acct-meter.good .acct-meter-fill { width: 65%; background: #ffb55c; }
    .acct-meter.strong .acct-meter-fill { width: 100%; background: #4ec97a; }
    .acct-strength-row { display: flex; gap: 8px; font-size: 12px; }
    .acct-strength-time.time-bad { color: #ff6b6b; }
    .acct-strength-time.time-ok  { color: #ffb55c; }
    .acct-strength-time.time-good{ color: #4ec97a; }
    .acct-breach { font-size: 12px; padding: 8px 10px; border-radius: 6px; }
    .acct-breach.ok { background: rgba(78,201,122,.12); color: #8bd8a6; }
    .acct-breach.bad { background: rgba(255,107,107,.12); color: #ffb0b0; }
    .acct-breach.pending { color: #a0a0a0; }
    .acct-gen { background: none; border: 1px dashed #00979D; color: #00979D; border-radius: 6px;
                padding: 8px; cursor: pointer; font-size: 13px; }
    .acct-tip { font-size: 12px; color: #a0a0a0; line-height: 1.5; }
    .acct-who { font-size: 13px; }
    .acct-program-list { display: flex; flex-direction: column; gap: 6px; }
    .acct-prog { display: flex; align-items: center; gap: 8px; background: #1e1e1e; border: 1px solid #3c3c3c;
                 border-radius: 6px; padding: 6px 10px; }
    .acct-prog-active { border-color: #00979D; }
    .acct-prog-name { flex: 1; cursor: pointer; font-size: 13px; }
    .acct-prog-btn { background: none; border: 0; color: #a0a0a0; cursor: pointer; font-size: 14px; }
    .acct-prog-btn.acct-prog-del:hover { color: #ff6b6b; }
    .acct-empty { color: #808080; font-size: 13px; padding: 8px; }
    .acct-hint { font-size: 11px; color: #808080; }
    /* ---- compile (porté de compile.js) ---- */
    #rdCompile { position: fixed; right: 16px; bottom: 16px; z-index: 9999; display: flex;
                 flex-direction: column; gap: 6px; font-family: sans-serif; font-size: 13px; align-items: flex-end; }
    .rdbtn { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; color: #fff;
             font-weight: 700; font-size: 14px; }
    #rdCompileBtn { background: #00878f; }
    #rdFlashBtn { background: #e7662d; display: none; }
    #rdDl { color: #00979D; cursor: pointer; font-weight: 600; display: none; text-decoration: underline; font-size: 12px; }
    #rdStatus { background: rgba(0,0,0,.85); color: #fff; padding: 9px 12px; border-radius: 8px;
                max-width: 360px; display: none; white-space: pre-wrap; font-size: 12px; text-align: left; }
    /* ---- responsive tablette / PC ---- */
    @media (pointer: coarse) {
      .pal-btn, .tbtn, .acct-btn { min-height: 44px; font-size: 15px; }
      header h1 { font-size: 18px; }
      aside { width: 100%; right: 0; top: 0; max-width: none; max-height: 50vh; border-radius: 0; }
      .topgrp { order: 3; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Arduino Blocks</h1>
    <span class="tag">Blockly 13.3 · tactile + souris</span>
    <span id="status"></span>
    <div class="catnav" id="catNav"></div>
    <div class="blockrow" id="blockRow"></div>
    <div class="topgrp">
      <select id="langSel" title="Langue / Language">
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
      <button class="tbtn" id="acctTopBtn" type="button" title="Compte et programmes">👤</button>
      <button class="tbtn" id="clearBtn" type="button" title="Effacer">🗑</button>
    </div>
  </header>

  <main id="container">
    <div id="blocklyDiv"></div>
    <aside>
      <h2 id="codeTitle">Code C++ généré (Arduino Uno)</h2>
      <pre id="code"></pre>
      <div class="hint" id="hint"></div>
    </aside>
  </main>

  <!-- libs vendues (pas de CDN) -->
  <script src="./lib/zxcvbn.js"></script>
  <script src="./lib/passwords_words.js"></script>
  <script src="./lib/avrgirl-arduino.global.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
