<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino Blocks — Nouvelle génération</title>
</head>
<body>
  <header>
    <h1>Arduino Blocks</h1>
    <span class="tag">Blockly 13.3 · tactile + souris</span>
    <span class="tag" id="appVersion" title="Version de l'application"></span>
    <span id="status"></span>
    <div class="catnav" id="catNav"></div>
    <div class="blockrow" id="blockRow"></div>
    <div class="topgrp">
      <select id="langSel" title="Langue / Language">
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
      <button class="tbtn" id="exBtn" type="button" title="Exemple">💡</button>
      <button class="tbtn" id="codeBtn" type="button" title="Code C++">&lt;/&gt;</button>
      <button class="tbtn" id="simBtn" type="button" title="Simulation">🔌</button>
      <button class="tbtn" id="acctTopBtn" type="button" title="Compte et programmes">👤</button>
      <button class="tbtn" id="clearBtn" type="button" title="Effacer">🗑</button>
    </div>
  </header>

  <main id="container">
    <div id="blocklyDiv"></div>
    <aside id="codePanel">
      <h2 id="codeTitle">Code C++ généré (Arduino Uno)</h2>
      <div id="manualBanner" class="manual-banner" style="display:none">
        <span id="manualBannerTxt">✍️ Programme modifié à la main.</span>
        <button id="manualRevert" type="button">↩ Revenir aux blocs</button>
      </div>
      <div id="codeEditor"></div>
      <div class="hint" id="hint"></div>
    </aside>
  </main>

  <!-- Fenêtre Exemples (choix par thème + fiche explicative) -->
  <aside id="exPanel" class="ex-panel" style="display:none">
    <div class="ex-bar">
      <span class="ex-title">💡 Exemples</span>
      <span class="ex-actions">
        <button class="ex-close" id="exCloseBtn" type="button" title="Fermer">✕</button>
      </span>
    </div>
    <div class="ex-body">
      <div class="ex-themes" id="exThemes"></div>
      <div class="ex-list" id="exList"></div>
      <div class="ex-detail" id="exDetail"></div>
    </div>
  </aside>

  <!-- Fenêtre simulation (2 moteurs : virtuelle + AVR8js réelle) -->
  <aside id="simPanelWrap" style="display:none">
    <div class="sim-win-bar" id="simWinBar">
      <span class="sim-win-title">🔌 Simulation</span>
      <span class="sim-win-actions">
        <button class="sim-win-btn" id="simMaxBtn" type="button" title="Agrandir / réduire">⛶</button>
        <button class="sim-win-btn" id="simCloseBtn" type="button" title="Fermer">✕</button>
      </span>
    </div>
    <div id="simPanel"></div>
    <div class="sim-resize" id="simResize"></div>
  </aside>

  <!-- libs vendues (pas de CDN) -->
  <script src="./lib/zxcvbn.js"></script>
  <script src="./lib/passwords_words.js"></script>
  <script src="./lib/avrgirl-arduino.global.js"></script>
  <script type="module" src="/src/main.js"></script>

  <!-- Accueil premier lancement -->
  <div id="welcome" class="welcome" style="display:none">
    <div class="welcome-card">
      <h2>Bienvenue 👋</h2>
      <p>Programme ta carte Arduino avec des blocs, puis compile et téléverse.</p>
      <div class="welcome-actions">
        <button id="welcomeNew" class="welcome-btn" type="button">🆕 Nouveau programme</button>
        <button id="welcomeExample" class="welcome-btn" type="button">💡 Exemple : LED + capteur</button>
        <button id="welcomePrograms" class="welcome-btn" type="button">👤 Mes programmes</button>
      </div>
    </div>
  </div>
</body>
</html>
